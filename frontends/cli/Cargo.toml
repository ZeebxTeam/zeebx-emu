[package]
name = "zeebx-cli"
version = "0.5.1"
edition = "2024"
license = "GPL-2.0-or-later"
description = "The Zeebx command line: run, measure and inspect a game without an interface"
authors = ["ZeebxTeam"]
repository = "https://github.com/ZeebxTeam/zeebx-emu"
publish = false

# **The binary is still named `zeebx`.** It used to be the egui window and the command line
# together; the window left (the interface is `zeebx-qt`, in `frontends/qt-standalone`), and the
# command line kept the name, which is what the scripts, CI and the documentation type:
# `zeebx session`, `zeebx bench`, `zeebx run`.
#
# **No Qt on purpose.** These are the measuring and debugging tools, and they need to compile on
# a machine or in a container without Qt installed. It doesn't ship in any installer either.
[[bin]]
name = "zeebx"
path = "src/main.rs"

[dependencies]
# The host devices (gilrs, Wii Remote), the raw window of `run --window` (minifb) and the offscreen
# context of `session --gpu` and of `bench` (glutin) come through the core's `desktop` feature,
# which is the default.
zeebx = { path = "../.." }

[build-dependencies]
winresource = "0.1"
