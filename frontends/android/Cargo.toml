[package]
name = "zeebx-android"
version = "0.5.1"
edition = "2024"
license = "GPL-2.0-or-later"
description = "The Android frontend of Zeebx"
publish = false

# `NativeActivity` loads a `.so` and calls its `android_main`. There is no Java class of ours:
# the whole app is this Rust, on top of the same core the desktop uses.
[lib]
name = "zeebx_android"
crate-type = ["cdylib"]

[dependencies]
# `audio` is `cpal`, which on Android talks to Oboe. Without it the session's `set_audio` doesn't
# exist and the device stays mute -- and doesn't compile. `soundfont` is MIDI played with an `.sf2`
# chosen in the settings: `rustysynth` is pure Rust, and the bank only takes memory (about 64 MiB
# for a 32 MB one) when there is one.
zeebx = { path = "../..", default-features = false, features = ["audio", "gl", "soundfont"] }

# **There is no eframe here, and that is the reason this file exists.** eframe spins the loop
# through winit, and winit throws away every controller button: it translates Android key codes
# to `Key::Unidentified`, which egui discards, and the stick axes don't even become events.
# Talking directly to `android-activity` we receive the input as Android delivers it —
# buttons, triggers, axes and "back" — and we also own the window's lifecycle.
android-activity = { version = "0.6", features = ["native-activity"] }
egui = { version = "0.33.3", default-features = false, features = ["default_fonts"] }
egui_glow = { version = "0.33.3", default-features = false }
glow = "0.16"
# The GL context: `NativeActivity` gives an `ANativeWindow`, and the rest is EGL. glutin already
# knows how to do that on Android and it is the same crate the desktop uses.
glutin = { version = "0.32.3", default-features = false, features = ["egl"] }
raw-window-handle = "0.6"

# `MANAGE_EXTERNAL_STORAGE` isn't a dialog permission: whoever asks for it opens a system screen
# through an `Intent`, and that is a call into Java. The version has to be the one
# `android-activity` resolves, otherwise there are two different JNIs in the same image.
jni = "0.21"
# Without this, a Rust panic dies silently: `adb logcat` shows nothing.
log = "0.4"
android_logger = "0.14"
