[package]
name = "zeebx-ios"
version = "0.5.1"
edition = "2024"
license = "GPL-2.0-or-later"
description = "The iOS frontend of Zeebx"
publish = false

# Xcode links a `.a`. The `rlib` exists for this package's `cargo test`: a `staticlib`-only
# crate-type produces no test binary.
[lib]
name = "zeebx_ios"
crate-type = ["staticlib", "rlib"]

[dependencies]
# `audio` and nothing else: it is `cpal`, which on iOS talks to Core Audio. Without the `desktop`
# feature: eframe, glutin and gilrs have nothing to do in UIKit, and glutin's OpenGL on iOS is
# EAGL, which Apple has already retired. The frame comes out of the software rasterizer and the
# screen paints it.
zeebx = { path = "../..", default-features = false, features = ["audio"] }
