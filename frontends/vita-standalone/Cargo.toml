[package]
name = "zeebx-vita"
version = "0.5.0"
edition = "2024"
license = "GPL-2.0-or-later"
description = "O Zeebx na PlayStation Vita, sem Libretro"
publish = false

[[bin]]
name = "zeebx-vita"
path = "src/main.rs"

[dependencies]
# Sem `desktop` e sem `audio`. O `audio` é o `cpal`, que não tem porta na Vita; o som sai pela
# `sceAudioOut` daqui. `gl` traz o preenchimento na placa, sem glutin: o contexto é o do vitaGL.
# `gpu` não entra — ela pede janela de desktop.
zeebx = { path = "../..", default-features = false, features = ["gl"] }
glow = "0.16"

[build-dependencies]
cc = "1.0"
