[package]
name = "zeebx-vita"
version = "0.5.1"
edition = "2024"
license = "GPL-2.0-or-later"
description = "Zeebx on the PlayStation Vita, without Libretro"
publish = false

[[bin]]
name = "zeebx-vita"
path = "src/main.rs"

[dependencies]
# Without `desktop` and without `audio`. `audio` is `cpal`, which has no Vita port; the sound goes
# out through `sceAudioOut` here. `gl` brings GPU filling, without glutin: the context is vitaGL's.
# `gpu` stays out — it asks for a desktop window.
zeebx = { path = "../..", default-features = false, features = ["gl"] }
glow = "0.16"

[build-dependencies]
cc = "1.0"
