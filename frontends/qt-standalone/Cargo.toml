[package]
name = "zeebx-standalone-qt"
version = "0.5.1"
edition = "2024"
license = "GPL-2.0-or-later"
description = "The definitive Zeebo emulator!"
authors = ["ZeebxTeam"]
repository = "https://github.com/ZeebxTeam/zeebx-emu"
publish = false

# **The binary is `zeebx-qt`, and not `zeebx`.** `zeebx` is the command line
# (`frontends/cli`), and both come out in the same `target/release`. The name is also the one
# people who already have the interface installed have: shortcut, `.desktop` and updater point
# to it.
[[bin]]
name = "zeebx-qt"
path = "src/main.rs"

[dependencies]
# The core with the `desktop` feature: the audio, input and game session that Qt reuses.
zeebx = { path = "../..", features = ["atualizador"] }
# The bridge to Qt: docs/implementation/21-qt-migration.md.
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
# The `Arc<glow::Context>` the session receives is from the `glow` the core uses: the same
# version, the same type.
glow = "0.16"
# The folder and file picker of the settings, the same one egui uses through the core: `rfd`
# isn't re-exported from there. Same version and same features, so the tree doesn't grow.
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

# The Qt installers, generated by `cargo packager --release` run in this directory: `.deb` and
# AppImage on Linux, NSIS on Windows, `.dmg` on macOS. Their own name, identifier and binary, so
# Zeebx Qt installs next to the egui Zeebx without one overwriting the other. The icon paths go
# up two levels because `assets/` is still at the repository root.
#
# **`cargo packager` doesn't deploy Qt**: each system has its own step in `release.yml` —
# `linuxdeploy-plugin-qt` for the AppImage, `windeployqt` on Windows, `macdeployqt` on macOS — and
# the `.deb` uses the system Qt. See phase 9 of `docs/implementation/21-qt-migration.md`.
[package.metadata.packager]
product-name = "Zeebx Qt"
identifier = "io.github.zeebxteam.zeebx.qt"
publisher = "ZeebxTeam"
homepage = "https://github.com/ZeebxTeam/zeebx-emu"
category = "Game"
description = "The definitive Zeebo emulator!"
out-dir = "../../target/pacotes"
before-packaging-command = "cargo build --release --locked -p zeebx-standalone-qt"
icons = ["../../assets/icons/zeebx-512.png", "../../assets/icons/zeebx.ico", "../../assets/icons/zeebx.icns"]
# The Windows Qt, which `windeployqt` gathers in this folder — the DLLs, the plugins and the QML
# modules — and NSIS installs next to `zeebx-qt.exe`, with the subfolders. It only exists on
# Windows: on the other systems the path matches nothing, and `cargo packager` includes nothing.
# The license text goes in every installer, in a `licenses` folder next to the program (in the
# `.deb`, in `/usr/lib/<binary>/licenses`; on macOS, in `Contents/Resources/licenses`). See
# `tools/third_party_notices.py`.
resources = [
    { src = "../../target/qt-implantado", target = "." },
    { src = "../../LICENSE", target = "licenses/LICENSE" },
    { src = "../../LICENSE-GPL3", target = "licenses/LICENSE-GPL3" },
    { src = "../../THIRD-PARTY-NOTICES.txt", target = "licenses/THIRD-PARTY-NOTICES.txt" },
]

[[package.metadata.packager.binaries]]
path = "zeebx-qt"
main = true

[package.metadata.packager.deb]
# `libasound2t64` is ALSA's name from Ubuntu 24.04 and Debian 13 on, and it comes **first**:
# `apt` keeps the first alternative that works, and on Ubuntu 24.04 `libasound2` is satisfied by
# `liboss4-salsa-asound2`, an ALSA imitation on top of OSS4 without all the symbols. On a system
# without the real ALSA, `apt` picked the imitation and the binary stopped on opening, with
# "undefined symbol: snd_pcm_status_get_trigger_htstamp" — checked on a clean `ubuntu:24.04`.
# The audio, input and GL ones are what the binary links outside Qt, checked with `ldd`: ALSA,
# `libudev`, GL, `libxkbcommon` and `libX11` (from the core's `glutin` and `minifb`). The ones
# `eframe` pulled in — `libXcursor`, `libXrandr`, `libXi` and `libwayland-client` — left with it:
# the binary doesn't link them anymore, and `libwayland-client` arrives through `qt6-wayland`.
#
# **The `.deb` uses the system Qt**, and that is why it is compiled against it, on Ubuntu 24.04: a
# Qt 6.11 binary doesn't run on an older Qt, and 24.04 ships 6.4. The Qt ones are what the binary
# links, checked with `ldd` and `dpkg -S` on Ubuntu 24.04 — `gui`, `network` and `opengl` with
# both names, because Ubuntu 24.04 calls them with `t64` and Debian 13 without —, the platform
# plugin, `qt6-wayland`, without which the window opens through XWayland, and the QML modules the
# `import`s ask for.
depends = [
    "libasound2t64 | libasound2",
    "libudev1",
    "libgl1",
    "libxkbcommon0",
    "libatomic1",
    "libx11-6",
    "libqt6core6t64",
    "libqt6gui6t64 | libqt6gui6",
    "libqt6network6t64 | libqt6network6",
    "libqt6opengl6t64 | libqt6opengl6",
    "libqt6qml6",
    "libqt6qmlmodels6",
    "libqt6quick6",
    "qt6-qpa-plugins",
    "qt6-wayland",
    "qml6-module-qtquick",
    "qml6-module-qtquick-controls",
    "qml6-module-qtquick-layouts",
    "qml6-module-qtquick-shapes",
    "qml6-module-qtquick-templates",
    "qml6-module-qtquick-window",
    "qml6-module-qtqml-workerscript",
]
section = "games"

# The AppImage carries its own Qt, the same 6.11 as development: `linuxdeploy-plugin-qt` copies
# the libraries, the plugins and the QML modules that `QML_SOURCES_PATHS` asks for. `QMAKE` says
# which Qt.
[package.metadata.packager.appimage]
linuxdeploy-plugins = { qt = "https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage" }

[package.metadata.packager.nsis]
installer-icon = "../../assets/icons/zeebx.ico"
installer-mode = "currentUser"
languages = ["PortugueseBR", "English", "Spanish"]

[package.metadata.packager.macos]
minimum-system-version = "11.0"

[build-dependencies]
winresource = "0.1"
cxx-qt-build = "0.10"
# Only for `QResourceFile`, which gives an alias to a file in the QML resources and which
# cxx-qt-build doesn't re-export: the Boomerang image lives in `assets/`, two levels above this
# package.
qt-build-utils = "0.10"
