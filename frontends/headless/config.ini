# Zeebx without an interface — configuration file.
#
# Keys and values are in English, like the commands. Everything here is optional: a missing key
# is worth what is written as the default. A comment starts with `#` or with `;`. A value with a
# space or a `#` in the middle goes in quotes.
#
# The emulator looks for this file next to the executable and then in the system configuration
# folder (`~/.config/zeebx/`, `%APPDATA%\Zeebx\`, `~/Library/Application Support/Zeebx/`).
# `--config=PATH` tells it to use another one.

[video]
# window | fullscreen | none
# In `none` nothing is drawn: the frame goes out through the [dump] section and your frontend
# does the painting. In that mode there is no keyboard — no window means no focus —, and whoever
# plays uses a controller.
mode = window
# How the frame fills the window: integer (only multiples of the console frame, never blurs and
# leaves a border), fit (the largest that fits keeping the proportion) or stretch (fills it all).
scaling = fit
# Interpolate when enlarging. Off, the console pixel shows up as a block.
smooth = false
# Keep the 4:3 of the Zeebo screen. Off, the frame deforms to fill the window.
keep_aspect = true
# The frame limit: 60 holds the emulator at the console's pace; 30 keeps the pace and draws only
# one frame out of every two, to spare the graphics card; off lets it run as fast as the machine
# can take, and games run sped up. The old `speed_limit = false` still counts as `off`.
fps_limit = 60
# Skip drawing some frames, without changing the game speed: off, auto (only what wasn't going to
# show on screen) or a number from 1 to 6 (draws one frame out of every n+1). Games that read
# their own screen never skip.
frameskip = off
# Wait for the screen's vertical retrace to swap the frame.
vsync = true
# The window title. A frontend that manages windows usually matches on it.
title = Zeebx
# The size the window opens with, when it isn't fullscreen.
width = 1280
height = 960

[graphics]
# Fill the console's 3D on the graphics card, instead of on the CPU. It changes **who
# rasterizes**, and the drawing doesn't come out identical to software — edge rules and rounding
# diverge by construction. Faster in the measured titles; the game-by-game review is up to you.
gpu_rasterizer = false
# The internal resolution of the 3D on the graphics card, in multiples of 640x480 per side. It only
# applies with the line above on; the game still sees 640x480.
internal_resolution = 1
# Antialias in samples per pixel, and anisotropic texture filtering. 1 turns both off.
antialias = 1
anisotropic = 1
# **Experimental.** The proportion the 3D on the graphics card is rendered at: native | 16x9 |
# 16x10 | window. Outside native, the perspective scene gains sides instead of being stretched.
aspect = native
# Let the game's fog apply. On the console it usually hides what the draw distance didn't reach;
# here the scene arrives whole, and whoever prefers to see far turns it off.
fog = true

[audio]
enabled = true
# From 0 to 100.
volume = 80
# The `.sf2` bank MIDI music plays with — the console's own, if you have it, or any General MIDI
# bank. Empty or `-` looks in the device's `soundfonts` folder. The command line's
# `--soundfont=PATH` wins over this one.
# soundfont = /home/you/soundfonts/GeneralUser-GS.sf2
# The reverb and chorus the MIDI music asks for, when it plays through the `.sf2` bank. Off, the
# notes end dry. Takes effect from the next game opened.
midi_effects = true

[system]
# Where the games are. It is what lets the Z-Wheel list and open the titles.
# On Windows, the path goes in quotes because of the spaces: roms = "C:\Games\Zeebo"
# roms = /home/you/roms/zeebo
# The Z-Wheel package. It is what the console returns to when a game exits on its own, like on
# the real device. **It isn't what it opens**: the game to run always comes from the command line,
# and to open through the Z-Wheel you just pass it as the game. Without this line, a game that
# exits closes the emulator.
# z_wheel = /home/you/roms/zeebo/Z-Wheel.zip
# The Z-Wheel's bottom end-of-life wheel ("Jogar" and "Ajuda", Play and Help), which is this
# ROM's factory one.
z_wheel_end_of_life = true
# Exit when the game exits, instead of going back to the Z-Wheel. It is what an outside frontend
# usually wants: its own screen is what shows up again.
exit_with_game = false
# How many seconds of game time to run before exiting on its own. 0 runs until it is closed.
seconds = 0
# How much the core writes to standard error. The chosen level goes in and everything more
# severe as well: `off` silences, `fatal` shows only what prevents continuing, `error` adds the
# handled failures, `warn` (default) what went off the expected path, `info` what happened and is
# worth knowing — game opened, cache pruning, sound bank loading —, and `debug` the path of every
# decision, which is verbose and slower. The `ZEEBX_LOG` variable does the same and counts as
# the starting point.
log = warn
# The language of the core's messages. Without this, the system's.
# language = pt-BR

# Only in `none` mode. The frames go out one after the other, always the same size and with no
# header at all — whoever reads already knows the size, because the console has only one. A frame
# is only written when it changes.
#
# In the raw formats the frame is always the console's, 640x480: a byte stream without a header
# has to have a frame of the same size from start to end, otherwise whoever counts bytes on the
# other side loses step. `internal_resolution` and the wide proportion don't reach here — they
# apply in the window. `png` is the exception, because each file states its own size.
[dump]
# rgb565 (two bytes per pixel, the way the console stores it — the cheapest), rgba (four bytes,
# in R G B A order) or png (one file per frame, to check, not to play).
format = rgb565
# `-` is standard output, and it is what `zeebx-headless game.mod | your-frontend` uses. With a
# path, it writes there — including to a FIFO, and then nothing touches the disk. In `png`, it is
# a folder.
destination = -
# Stop after this many frames. 0 is no limit.
frame_limit = 0

# The console's USB ports.
#
# This block is **generated from the emulator's defaults**, not written by hand: each line below
# is what would apply if it didn't exist. That is on purpose — a hand-written example ages
# silently the day a default changes, and a file that lies about the default is worse than a
# file without the line.
#
# Naming the section already turns the port on, and that is why the second one carries an
# explicit `enabled = false`: it shows up here to be edited, not to be turned on. Turn it on for
# the console to enumerate two devices — that is how you test a game that behaves differently
# with two controllers.
#
# One button per line, with the sources separated by commas: `key:NAME`, `button:NAME` or
# `axis:NAME+` / `axis:NAME-`. Writing the line **replaces** that button's default; an empty
# line leaves the button with no source at all. The thirteen mappable ones are all below — the
# Zeebo has no Start, and HOME plays that role (it is `back`).
#
# The key and button names are **the same as in the desktop interface's settings.json**, on
# purpose: a mapping copied from there works here without translation, and the controls screen
# is still the easiest way to find out what a button is called. `--controllers` lists the
# controllers the system sees, with the names the `controller` key expects.
#<<portas>>
