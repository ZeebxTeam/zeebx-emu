# Zeebx sem interface — arquivo de configuração.
#
# As chaves e os valores são em inglês, como os comandos; os comentários, não. Tudo aqui é
# opcional: uma chave que falta vale o que está escrito como padrão. Comentário começa com `#`
# ou com `;`. Um valor com espaço ou com `#` no meio vai entre aspas.
#
# O emulador procura este arquivo ao lado do executável e depois na pasta de configuração do
# sistema (`~/.config/zeebx/`, `%APPDATA%\Zeebx\`, `~/Library/Application Support/Zeebx/`).
# `--config=CAMINHO` manda usar outro.

[video]
# window | fullscreen | none
# Em `none` nada é desenhado: o quadro sai pela seção [dump] e quem pinta é o seu frontend.
# Nesse modo não há teclado — sem janela não há foco —, e quem joga usa um controle.
mode = window
# Como o quadro preenche a janela: integer (só múltiplos do quadro do console, nunca borra e
# sobra moldura), fit (o maior que couber mantendo a proporção) ou stretch (preenche tudo).
scaling = fit
# Interpolar ao ampliar. Desligado, o pixel do console aparece como bloco.
smooth = false
# Manter os 4:3 da tela do Zeebo. Desligado, o quadro se deforma para encher a janela.
keep_aspect = true
# Segurar o emulador no ritmo do console. Desligado, ele corre o quanto a máquina aguentar e os
# jogos ficam acelerados.
speed_limit = true
# Esperar o retraço da tela para trocar o quadro.
vsync = true
# O título da janela. Um frontend que gerencia janelas costuma casar por ele.
title = Zeebx
# O tamanho com que a janela abre, quando ela não é cheia.
width = 1280
height = 960

[graphics]
# Preencher o 3D do console na placa, em vez de na CPU. Muda **quem rasteriza**, e o desenho
# não sai idêntico ao de software — regra de borda e arredondamento divergem por construção.
# Mais rápido nos títulos medidos; a revisão jogo a jogo é de quem usa.
gpu_rasterizer = false
# A resolução interna do 3D na placa, em múltiplos de 640x480 por lado. Só vale com a linha
# acima ligada; o jogo continua vendo 640x480.
internal_resolution = 1
# Antialias em amostras por pixel, e filtro anisotrópico das texturas. 1 desliga os dois.
antialias = 1
anisotropic = 1
# **Experimental.** A proporção em que o 3D na placa é renderizado: native | 16x9 | 16x10 |
# window. Fora do nativo, a cena em perspectiva ganha lados em vez de ser esticada.
aspect = native
# Deixar a névoa do jogo valer. No console ela costuma esconder o que a distância de desenho
# não alcançava; aqui a cena chega inteira, e quem prefere ver longe desliga.
fog = true

[audio]
enabled = true
# De 0 a 100.
volume = 80

[system]
# Onde estão os jogos. É o que permite a Z-Wheel listar e abrir os títulos.
# No Windows, o caminho vai entre aspas por causa dos espaços: roms = "C:\Jogos\Zeebo"
# roms = /home/voce/roms/zeebo
# O pacote da Z-Wheel. É para ela que o console volta quando um jogo sai sozinho, como no
# aparelho de verdade. **Não é o que ele abre**: o jogo a rodar vem sempre da linha de comando,
# e para abrir pela Z-Wheel basta passá-la como jogo. Sem esta linha, um jogo que sai encerra o
# emulador.
# z_wheel = /home/voce/roms/zeebo/Z-Wheel.zip
# A roda inferior de fim de vida da Z-Wheel ("Jogar" e "Ajuda"), que é a de fábrica desta ROM.
z_wheel_end_of_life = true
# Sair quando o jogo sair, em vez de voltar à Z-Wheel. É o que um frontend de fora costuma
# querer: a tela dele é que volta a aparecer.
exit_with_game = false
# Quantos segundos de tempo do jogo rodar antes de sair sozinho. 0 roda até fecharem.
seconds = 0
# Quanto o núcleo escreve no erro padrão. O nível escolhido entra e tudo o que for mais grave
# também: `off` cala, `fatal` mostra só o que impede continuar, `error` acrescenta as falhas
# tratadas, `warn` (padrão) o que saiu do previsto, `info` o que aconteceu e vale saber — jogo
# aberto, poda de cache, carga do banco de som —, e `debug` o caminho de cada decisão, que é
# verboso e mais lento. A variável `ZEEBX_LOG` faz o mesmo e vale como ponto de partida.
log = warn
# O idioma das mensagens do núcleo. Sem isto, o do sistema.
# language = pt-BR

# Só no modo `none`. Os quadros saem um atrás do outro, sempre do mesmo tamanho e sem cabeçalho
# nenhum — quem lê já sabe o tamanho, porque o console tem um só. Um quadro só é escrito quando
# muda.
#
# Nos formatos crus o quadro é sempre o do console, 640x480: um fluxo de bytes sem cabeçalho tem
# de ter o quadro do mesmo tamanho do começo ao fim, senão quem conta bytes do outro lado perde
# o passo. `internal_resolution` e a proporção larga não chegam aqui — elas valem na janela. O
# `png` é a exceção, porque cada arquivo diz o próprio tamanho.
[dump]
# rgb565 (dois bytes por pixel, do jeito que o console guarda — o mais barato), rgba (quatro
# bytes, na ordem R G B A) ou png (um arquivo por quadro, para conferir, não para tocar).
format = rgb565
# `-` é a saída padrão, e é o que `zeebx-headless jogo.mod | seu-frontend` usa. Com um caminho,
# escreve nele — inclusive num FIFO, e aí nada passa por disco. Em `png`, é uma pasta.
destination = -
# Parar depois de tantos quadros. 0 é sem limite.
frame_limit = 0

# As portas USB do console.
#
# Este bloco é **gerado a partir dos padrões do emulador**, não escrito à mão: cada linha abaixo
# é o que valeria se ela não existisse. Isso é de propósito — um exemplo escrito à mão envelhece
# calado no dia em que um padrão muda, e um arquivo que mente sobre o padrão é pior que um
# arquivo sem a linha.
#
# Citar a seção já liga a porta, e por isso a segunda traz um `enabled = false` explícito: ela
# aparece aqui para ser editada, não para ser ligada. Ligue-a para o console enumerar dois
# aparelhos — é assim que se testa um jogo que se comporta diferente com dois controles.
#
# Um botão por linha, com as origens separadas por vírgula: `key:NOME`, `button:NOME` ou
# `axis:NOME+` / `axis:NOME-`. Escrever a linha **substitui** o padrão daquele botão; uma linha
# vazia deixa o botão sem origem nenhuma. Os treze mapeáveis estão todos abaixo — o Zeebo não
# tem Start, e o HOME faz esse papel (é o `back`).
#
# Os nomes de tecla e de botão são **os mesmos do settings.json** da interface do desktop, de
# propósito: um mapeamento copiado de lá vale aqui sem tradução, e a tela de controles continua
# sendo o jeito mais fácil de descobrir como um botão se chama. `--controllers` lista os
# controles que o sistema enxerga, com os nomes que a chave `controller` espera.
#<<portas>>
