# Builds the core for Android and assembles the APK, without waiting for the tag.
#
# `release.yml` assembles the same APK, but only on tag day and together with everything else.
# Here the APK comes out on its own, by hand, and with two checks the release doesn't do: the
# `.so` inside is AArch64 and the packaged ABI is the one that was asked for. An APK that builds
# but carries the wrong library installs and breaks on the device, and that is expensive to find
# out after the tag.
#
# **No push or merge triggers this.** The repository's only automatic trigger is the tag, in
# `release.yml`; here you are the one who requests the run from the Actions tab.
#
# The APK comes out signed with the debug key, which is the one Gradle generates on its own: it
# is good for sideloading (`adb install`), not for the Play Store.

name: android

on:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # A single ABI, and it is what `apk/app/build.gradle.kts` filters. Adding another means
        # touching both places, not just here.
        include:
          - abi: arm64-v8a
            alvo: aarch64-linux-android
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvo }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ci-${{ matrix.abi }}

      # AGP 8.7 asks for JDK 17. The runner ships several; saying which one avoids depending on
      # which of them is the default in this month's image.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # With no wrapper in the project, the Gradle version is chosen here — and it has to be one
      # AGP 8.7.3 accepts.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # `ninja` is the generator `ndk-toolchain.cmake` uses for the core's C and C++ — unicorn
      # and dynarmic.
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # The exact version `build.sh` expects. The runner image ships some NDK, but which one
      # changes with it, and the script builds the path from the number.
      - name: NDK
        run: |
          version=$(grep -oP 'ANDROID_NDK_DEFAULT=\K[0-9.]+' frontends/android/build.sh)
          echo "installing NDK $version"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$version" > /dev/null

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build and assemble the APK
        env:
          ZEEBX_ANDROID_ABI: ${{ matrix.abi }}
        run: frontends/android/build.sh --apk

      # What the release doesn't check: open the APK and look at the library inside it. An APK
      # that builds with the host's `.so` installs and dies at the first `System.loadLibrary`.
      - name: The APK carries the right library
        shell: bash
        run: |
          apk=frontends/android/apk/app/build/outputs/apk/debug/zeebx-android-${{ matrix.abi }}.apk
          ls -la "$apk"
          unzip -l "$apk" | grep "lib/${{ matrix.abi }}/"
          if unzip -l "$apk" | grep -qE 'lib/(x86|x86_64|armeabi-v7a)/'; then
            echo "the APK carried an ABI that is not the one requested"
            exit 1
          fi
          mkdir -p prova && unzip -o -j "$apk" "lib/${{ matrix.abi }}/*.so" -d prova > /dev/null
          for so in prova/*.so; do
            file "$so" | grep -Eiq 'ARM aarch64|aarch64' || {
              echo "$so is not AArch64"
              exit 1
            }
          done
          echo "the APK libraries are AArch64, and there is only the ${{ matrix.abi }} ABI"

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-android-${{ matrix.abi }}
          path: frontends/android/apk/app/build/outputs/apk/debug/zeebx-android-${{ matrix.abi }}.apk
          if-no-files-found: error
          retention-days: 14
