# Gera os pacotes nos três sistemas e monta a release.
#
# Dispara com uma tag de versão — `v0.1.0` ou `0.1.0` — ou à mão, pela aba Actions. A release sai
# como **rascunho**, com o título igual à tag: dá para conferir os arquivos antes de publicar, e o
# verificador de atualizações do emulador ignora rascunhos até lá.
#
# Os nomes dizem qual formato é qual:
#
#   zeebx-standalone-linux-x86_64.deb        o emulador com a interface, para instalar
#   zeebx-headless-linux-x86_64.zip          o binário sem interface, para quem tem frontend próprio
#   zeebx-android-arm64-v8a.apk              o aplicativo de Android
#   zeebx-ios-simulator.zip                  o aplicativo de iOS, para o simulador, com o leia-me
#   zeebx-ios.zip                            o IPA para o AltStore clássico, com o leia-me
#   zeebx_libretro-linux-aarch64.zip         o core Libretro, com o `.info`, para RetroArch
#   zeebx_libretro-wasm.zip                  o mesmo core em WebAssembly, para o ROMBundler
#
# O APK sai assinado com a chave de depuração, que é a que o Gradle gera sozinho. Serve para
# instalar de lado (`adb install`), **não** para a Play Store: aquela pede a chave de publicação,
# que não pode morar num repositório público.

name: release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
  # Chamado pelo `tag.yml` quando a `master` recebe uma versão nova.
  #
  # **Por que chamada e não uma tag empurrada:** uma tag criada com o `GITHUB_TOKEN` não dispara
  # workflow nenhum -- o GitHub bloqueia isso para não haver recursão. O robô criaria a tag e
  # ninguém montaria os pacotes. Sendo chamado, tudo acontece na mesma execução, e não é preciso
  # guardar um token de pessoa como segredo.
  workflow_call:
    inputs:
      versao:
        description: "A tag da release, já criada pelo chamador (ex.: v0.3.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  standalone:
    name: standalone ${{ matrix.nome }} (${{ matrix.formatos }})
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        # **A interface é a do Qt** (fase 8 de `docs/implementacao/21-migracao-para-qt.md`), e o
        # `cargo packager` não implanta o Qt: cada formato tem o passo dele, abaixo. O AppImage, o
        # NSIS e o `.dmg` levam o próprio Qt — a versão exata, e não `6.11.*`, porque o Qt publica
        # os pacotes de um patch novo antes dos checksums e o `aqtinstall` falha no dia (ver o
        # `qt.yml`). O `.deb` usa o Qt do sistema, e por isso sai à parte, no Ubuntu 24.04: um
        # binário do Qt 6.11 não roda num Qt mais velho, e o 24.04 traz o 6.4.
        include:
          - nome: linux-x86_64
            sistema: ubuntu-22.04
            formatos: appimage
            qt: "6.11.2"
          - nome: linux-x86_64
            sistema: ubuntu-24.04
            formatos: deb
            qt: sistema
          - nome: windows-x86_64
            sistema: windows-latest
            formatos: nsis
            qt: "6.10.3"
          - nome: macos-arm64
            sistema: macos-latest
            formatos: dmg
            qt: "6.11.2"
          - nome: macos-x86_64
            sistema: macos-15-intel
            formatos: dmg
            qt: "6.11.2"
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # O sistema entra na chave: o cache do Ubuntu 24.04 restaurado no 22.04 traz scripts de build
      # ligados a uma glibc mais nova, que não rodam lá.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.nome }}-${{ matrix.sistema }}

      # As `libxcb-*` são as dependências do plugin de plataforma do Qt, que o
      # `linuxdeploy-plugin-qt` precisa achar para levar ao AppImage.
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 libclang-dev \
            libglib2.0-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libfuse2 \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1

      - name: Qt do sistema
        if: matrix.qt == 'sistema'
        run: |
          sudo apt-get install -y qt6-base-dev qt6-base-dev-tools qt6-declarative-dev \
            qt6-declarative-dev-tools qmake6

      - name: Dependências do macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      - name: Qt
        if: matrix.qt != 'sistema'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          cache: true

      # O `cxx-qt-build` acha o Qt pelo `qmake`. Dizer qual evita pegar outro que esteja no PATH
      # da imagem do runner.
      - name: qmake
        shell: bash
        run: |
          if [ "${{ matrix.qt }}" = sistema ]; then qmake=/usr/bin/qmake6; else qmake="$QT_ROOT_DIR/bin/qmake"; fi
          [ "$RUNNER_OS" = Windows ] && qmake="$qmake.exe"
          echo "QMAKE=$qmake" >> "$GITHUB_ENV"

      - name: cargo-packager
        run: cargo install cargo-packager --locked

      # Os testes ainda não foram rodados em Windows e macOS: um tropeço neles aparece no log
      # sem impedir os pacotes. O frontend sem interface entra aqui porque o núcleo já está
      # compilado neste job, e testá-lo num job próprio seria pagar a compilação duas vezes.
      - name: Testes
        continue-on-error: true
        run: cargo test --release --locked -p zeebx -p zeebx-classical-standalone -p zeebx-headless

      # **Roda no diretório do frontend, e não na raiz.** O `cargo packager` lê a configuração do
      # manifesto onde é chamado, e desde a 0.3.0 ela mora no pacote que produz o binário. Os
      # pacotes continuam saindo em `target/pacotes` da raiz, pelo `out-dir` de lá.
      #
      # O `linuxdeploy-plugin-qt` leva o Qt que o `QMAKE` diz, com os módulos QML que o
      # `QML_SOURCES_PATHS` importa. O Wayland vai à parte: o plugin de plataforma
      # (`libqwayland.so`, um só a partir do Qt 6.10) e o módulo `waylandcompositor`, sem o qual a
      # integração gráfica não vai junto e a janela não tem GL no Wayland.
      - name: AppImage
        if: matrix.formatos == 'appimage'
        working-directory: frontends/classical-standalone
        env:
          QML_SOURCES_PATHS: ${{ github.workspace }}/frontends/classical-standalone/qml
          EXTRA_PLATFORM_PLUGINS: libqwayland.so
          EXTRA_QT_MODULES: waylandcompositor
          # O AppImage é montado sem FUSE no runner.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo packager --release --formats appimage

      - name: .deb
        if: matrix.formatos == 'deb'
        working-directory: frontends/classical-standalone
        run: cargo packager --release --formats deb

      # O `windeployqt` junta numa pasta o que o `zeebx.exe` precisa do Qt — as DLLs, os plugins e
      # os módulos QML que os arquivos de `qml/` importam —, e a configuração dos pacotes manda o
      # NSIS instalar a pasta ao lado do executável.
      - name: Instalador do Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cargo build --release --locked -p zeebx-classical-standalone
          windeployqt --release --no-translations \
            --qmldir frontends/classical-standalone/qml \
            --dir target/qt-implantado target/release/zeebx.exe
          cd frontends/classical-standalone
          cargo packager --release --formats nsis

      # O `cargo packager` monta o `.app`, e o `macdeployqt` põe dentro dele os frameworks, os
      # plugins e os módulos QML. Ele altera os binários, e no ARM um binário alterado sem
      # assinatura válida é morto ao abrir: a assinatura ad-hoc é refeita depois. O `.dmg` sai do
      # `hdiutil` porque o `dmg` do `cargo packager` remontaria o `.app` por cima do que o
      # `macdeployqt` fez; ele leva o atalho para Aplicativos, como o do `cargo packager` levava.
      - name: Imagem do macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          (cd frontends/classical-standalone && cargo packager --release --formats app)
          app=target/pacotes/Zeebx.app
          macdeployqt "$app" -qmldir="$GITHUB_WORKSPACE/frontends/classical-standalone/qml"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          raiz=$(mktemp -d)
          cp -R "$app" "$raiz/"
          ln -s /Applications "$raiz/Applications"
          hdiutil create -volname Zeebx -srcfolder "$raiz" -ov -format UDZO target/pacotes/Zeebx.dmg
          rm -rf "$raiz"

      # O `cargo-packager` nomeia pelo produto e pela versão (`Zeebx_0.2.1_x64-setup.exe`), e o
      # nome não diz de qual sistema nem de qual formato o arquivo é. Numa release com oito
      # arquivos isso importa. O que muda é só o nome do arquivo: o `.deb` continua trazendo os
      # metadados dele, e o atualizador do emulador olha a tag, não os nomes.
      - name: Nomear
        shell: bash
        run: |
          cd target/pacotes
          for arquivo in *; do
            case "$arquivo" in
              *-setup.exe) novo="zeebx-standalone-${{ matrix.nome }}-setup.exe" ;;
              *.deb)       novo="zeebx-standalone-${{ matrix.nome }}.deb" ;;
              *.AppImage)  novo="zeebx-standalone-${{ matrix.nome }}.AppImage" ;;
              *.dmg)       novo="zeebx-standalone-${{ matrix.nome }}.dmg" ;;
              *)           continue ;;
            esac
            mv -- "$arquivo" "$novo"
            echo "$arquivo -> $novo"
          done

      # O Gatekeeper marca o que veio da internet e, sem assinatura da Apple, abre com
      # "Zeebx.app is damaged". O aviso some com `xattr -dr com.apple.quarantine`. A nota
      # entra na imagem, ao lado do aplicativo, para quem abre o `.dmg` ler antes de arrastar.
      - name: Nota do Gatekeeper
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          dmg=$(echo target/pacotes/*.dmg)
          tmp=$(mktemp -d)
          mnt="$tmp/mnt"
          mkdir -p "$mnt"
          hdiutil convert "$dmg" -format UDRW -o "$tmp/rw"
          hdiutil attach "$tmp/rw.dmg" -mountpoint "$mnt" -nobrowse
          cp frontends/classical-standalone/LEIA-ME-macos.txt "$mnt/LEIA-ME.txt"
          sync
          hdiutil detach "$mnt"
          rm -f "$dmg"
          hdiutil convert "$tmp/rw.dmg" -format UDZO -o "${dmg%.dmg}"
          rm -rf "$tmp"

      # O nome leva o formato: o Linux sai de dois jobs, e dois artefatos com o mesmo nome não
      # sobem.
      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-standalone-${{ matrix.nome }}-${{ matrix.formatos }}
          path: |
            target/pacotes/*.deb
            target/pacotes/*.AppImage
            target/pacotes/*-setup.exe
            target/pacotes/*.dmg
          if-no-files-found: error

  headless:
    name: headless ${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: linux-x86_64
            sistema: ubuntu-22.04
          - nome: windows-x86_64
            sistema: windows-latest
          - nome: macos-arm64
            sistema: macos-latest
          - nome: macos-x86_64
            sistema: macos-15-intel
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      # Cache separado do standalone porque os perfis de build diferem — lá o `cargo-packager`
      # entra na conta. As dependências são quase as mesmas: o `zeebx` é a biblioteca inteira, e
      # fora do Android ela traz o eframe e companhia por conta própria.
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-${{ matrix.nome }}

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libasound2-dev libudev-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libx11-dev libxcursor-dev \
            libxrandr-dev libxi-dev

      - name: Dependências do macOS
        if: runner.os == 'macOS'
        run: brew install cmake || true

      - name: Compilar
        run: cargo build --release --locked -p zeebx-headless

      # O que vai no pacote: o binário, o `config.ini` comentado e o leia-me. O arquivo de
      # configuração vai junto porque o primeiro lugar em que o emulador o procura é ao lado do
      # executável — é o que faz uma cópia portátil funcionar sem tocar na máquina.
      - name: Juntar
        shell: bash
        run: |
          mkdir -p entrega
          cp frontends/headless/config.ini frontends/headless/LEIAME.md entrega/
          if [ "$RUNNER_OS" = "Windows" ]; then
            cp target/release/zeebx-headless.exe entrega/
          else
            cp target/release/zeebx-headless entrega/
          fi
          ls -l entrega

      # O `zip` existe no Linux e no macOS; no Windows quem compacta é o PowerShell. Nenhum dos
      # dois precisa ser instalado, que é o motivo de não usar a mesma ferramenta nos três.
      - name: Compactar (Unix)
        if: runner.os != 'Windows'
        run: cd entrega && zip -r "../zeebx-headless-${{ matrix.nome }}.zip" .

      - name: Compactar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path entrega\* -DestinationPath "zeebx-headless-${{ matrix.nome }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-headless-${{ matrix.nome }}
          path: zeebx-headless-${{ matrix.nome }}.zip
          if-no-files-found: error

  android:
    name: android ${{ matrix.abi }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # Uma ABI só, e é o que o `apk/app/build.gradle.kts` filtra. Acrescentar outra é mexer
        # nos dois lugares, não só aqui.
        include:
          - abi: arm64-v8a
            alvo: aarch64-linux-android
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.alvo }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}

      # O AGP 8.7 pede o JDK 17. O runner traz vários; dizer qual evita depender de qual deles
      # está como padrão na imagem do mês.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sem wrapper no projeto, a versão do Gradle é escolhida aqui — e precisa ser uma que o
      # AGP 8.7.3 aceite. Deixá-la para o que a imagem traz é deixar a build quebrar sozinha no
      # dia em que a imagem mudar.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # O `ninja` é o gerador que o `ndk-toolchain.cmake` usa para o C e o C++ do núcleo — o
      # unicorn e o dynarmic.
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      # A versão exata que o `compilar.sh` espera. A imagem do runner traz algum NDK, mas qual
      # muda com ela, e o script monta o caminho a partir do número.
      - name: NDK
        run: |
          versao=$(grep -oP 'ANDROID_NDK_VERSAO:=\K[0-9.]+' frontends/android/compilar.sh)
          echo "instalando o NDK $versao"
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "ndk;$versao" > /dev/null

      - name: cargo-ndk
        run: cargo install cargo-ndk --locked

      # O script acha o SDK pelo `ANDROID_SDK_ROOT` e o Gradle pelo caminho, então não há
      # caminho nenhum repetido aqui.
      - name: Compilar e montar a APK
        env:
          ZEEBX_ANDROID_ABI: ${{ matrix.abi }}
        run: frontends/android/compilar.sh --apk

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-android-${{ matrix.abi }}
          path: frontends/android/apk/app/build/outputs/apk/debug/zeebx-android-${{ matrix.abi }}.apk
          if-no-files-found: error

  ios:
    name: ios
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - uses: Swatinem/rust-cache@v2
        with:
          key: ios

      # O script é o mesmo da máquina. `--app` monta o simulador; `--app-aparelho` fecha o link
      # do aparelho sem certificado — instalar no telefone pede DEVELOPMENT_TEAM, que não mora
      # no repositório.
      - name: Simulador
        run: frontends/ios/compilar.sh --app

      - name: Aparelho
        run: frontends/ios/compilar.sh --app-aparelho

      - name: Empacota
        run: frontends/ios/compilar.sh --pacote

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-ios-simulator
          path: frontends/ios/build/zeebx-ios-simulator.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-ios
          path: frontends/ios/build/zeebx-ios.zip
          if-no-files-found: error

  core:
    name: core-${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: linux-x86_64
            sistema: ubuntu-24.04
            biblioteca: target/release/libzeebx_libretro.so
            arquivo: zeebx_libretro.so
          - nome: linux-aarch64
            sistema: ubuntu-24.04-arm
            biblioteca: target/release/libzeebx_libretro.so
            arquivo: zeebx_libretro.so
          - nome: windows-x86_64
            sistema: windows-latest
            biblioteca: target/release/zeebx_libretro.dll
            arquivo: zeebx_libretro.dll
          - nome: windows-aarch64
            sistema: windows-11-arm
            biblioteca: target/release/zeebx_libretro.dll
            arquivo: zeebx_libretro.dll
          - nome: macos-arm64
            sistema: macos-latest
            biblioteca: target/release/libzeebx_libretro.dylib
            arquivo: zeebx_libretro.dylib
          - nome: macos-x86_64
            sistema: macos-15-intel
            biblioteca: target/release/libzeebx_libretro.dylib
            arquivo: zeebx_libretro.dylib
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: core-${{ matrix.nome }}

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libclang-dev libglib2.0-dev

      - name: Dependências do macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      - name: Compila o core
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          # A35 é o denominador comum seguro entre RK3326 e H700/A53. AArch64 continua usando
          # NEON/AdvSIMD, mas o artefato não ganha instrução exclusiva do Cortex-A53.
          RUSTFLAGS: ${{ matrix.nome == 'linux-aarch64' && '-C target-cpu=cortex-a35' || '' }}
        run: cargo build --release --locked -p zeebx-libretro

      # A mesma prova do `libretro.yml`: abrir a biblioteca como o frontend abre e chamar a ABI.
      - name: A biblioteca carrega e a ABI responde
        run: python3 ferramentas/verifica_core.py "${{ matrix.biblioteca }}"

      # Vídeo, áudio e entrada são do frontend: o artefato que vai para a mão do usuário é o
      # daqui, então a proibição do `libretro.yml` vale sobretudo no dia da tag.
      - name: O core não depende de biblioteca de host (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd "${{ matrix.biblioteca }}"
          if ldd "${{ matrix.biblioteca }}" | grep -qiE 'libX11|wayland|EGL|libGL|asound|libudev|gtk'; then
            echo "o core puxou biblioteca de interface: vídeo, áudio e entrada são do frontend"
            exit 1
          fi
          echo "só libc, libm, libstdc++ e libgcc"

      # O pacote que vai para R36S/RG40XX-H deve ser o ELF Linux AArch64, não o artefato do
      # runner por acidente. Os sistemas handhelds não têm RPATH do ambiente de build.
      - name: Confere o core Linux AArch64 dos handhelds
        if: matrix.nome == 'linux-aarch64'
        shell: bash
        run: |
          file "${{ matrix.biblioteca }}" | grep -Eiq 'ARM aarch64|aarch64'
          readelf -h "${{ matrix.biblioteca }}" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          ! readelf -d "${{ matrix.biblioteca }}" | grep -Eiq 'RPATH|RUNPATH'

      # **Cada sistema empacota com a ferramenta que tem.** O `zip` não existe no runner do
      # Windows, e o `Compress-Archive` não existe nos outros: um `shell: bash` com `zip` falharia
      # em um terço dos alvos, no dia da tag.
      - name: Empacota o core (Linux e macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p pacote
          cp "${{ matrix.biblioteca }}" "pacote/${{ matrix.arquivo }}"
          cp frontends/libretro/zeebx_libretro.info pacote/
          grep -q '^database = "Mobile - Zeebo"' pacote/zeebx_libretro.info
          cd pacote && zip -r "../zeebx_libretro-${{ matrix.nome }}.zip" .

      - name: Empacota o core (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path pacote | Out-Null
          Copy-Item "${{ matrix.biblioteca }}" "pacote/${{ matrix.arquivo }}"
          Copy-Item "frontends/libretro/zeebx_libretro.info" "pacote/"
          if (-not (Select-String -Path "pacote/zeebx_libretro.info" -Pattern '^database = "Mobile - Zeebo"')) {
            throw "o .info nao aponta para a base 'Mobile - Zeebo'"
          }
          Compress-Archive -Path pacote/* -DestinationPath "zeebx_libretro-${{ matrix.nome }}.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_${{ matrix.nome }}
          path: zeebx_libretro-${{ matrix.nome }}.zip

  # O side module que o ROMBundler faz dlopen. O Emscripten é o 6.0.8 dessa página: um
  # módulo de outra versão não carrega.
  wasm:
    name: core-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
          components: rust-src

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.8"

      - uses: Swatinem/rust-cache@v2
        with:
          key: core-wasm

      - name: Compila o side module
        run: ./ferramentas/compilar_wasm.sh

      - name: Empacota o core
        run: |
          mkdir -p pacote
          cp target/wasm/zeebx_libretro_emscripten.wasm pacote/
          cp frontends/libretro/zeebx_libretro.info pacote/
          grep -q '^database = "Mobile - Zeebo"' pacote/zeebx_libretro.info
          cd pacote && zip -r "../zeebx_libretro-wasm.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_wasm
          path: zeebx_libretro-wasm.zip
          if-no-files-found: error

  release:
    needs: [standalone, headless, android, ios, core, wasm]
    # Sai com o que deu certo: um sistema que falhou não segura os outros.
    #
    # A tag vem de dois lugares: do `push` de uma tag, e aí é o `github.ref_name`; ou do
    # `tag.yml`, e aí é o `inputs.versao` -- ali o `ref` é a `master`, e não a tag.
    if: ${{ !cancelled() && (inputs.versao != '' || startsWith(github.ref, 'refs/tags/')) }}
    runs-on: ubuntu-latest
    steps:
      # O repositório entra por causa das notas: o corpo da release sai de um arquivo versionado,
      # e sem `checkout` este job só tem os artefatos baixados.
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: pacotes
          merge-multiple: true

      # **O texto da release é o que vocês escreveram, e a lista gerada vem depois dele.** Cada
      # versão deixa a sua nota em `docs/patch-notes/`, em linguagem de quem joga; era isso que ia
      # para a página da release na mão.
      #
      # Os dois convivem, e não é truque nosso: a API do GitHub diz que, com `generate_release_notes`
      # ligado, um `body` enviado junto é **posto na frente** das notas geradas. Sai a nota, e
      # embaixo o "What's Changed", o "New Contributors" e o "Full Changelog" -- que é o crédito a
      # quem contribuiu pela primeira vez, e um arquivo escrito à mão não tem como saber disso.
      #
      # Sem o arquivo, sobra só a lista gerada: é melhor que uma release muda, e serve de aviso de
      # que a nota faltou.
      - name: As notas da versão
        id: notas
        shell: bash
        run: |
          tag="${{ inputs.versao || github.ref_name }}"
          for caminho in "docs/patch-notes/$tag.MD" "docs/patch-notes/$tag.md"; do
            if [ -f "$caminho" ]; then
              echo "notas em $caminho"
              echo "caminho=$caminho" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "não há nota para $tag em docs/patch-notes/; a release sai com a lista de commits"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.versao || github.ref_name }}
          tag_name: ${{ inputs.versao || github.ref_name }}
          draft: true
          # Os dois sempre: a nota vira o começo do corpo, e o GitHub acrescenta o resto.
          body_path: ${{ steps.notas.outputs.caminho }}
          generate_release_notes: true
          files: pacotes/*
