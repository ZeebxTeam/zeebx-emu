# Compila o core Libretro e confere que ele é carregável, sem bibliotecas de host.
#
# O core é o pacote `frontends/libretro`, compilado com `--no-default-features` no motor.
# Artefatos: `zeebx_libretro_<alvo>` (underscore), para não colidir com os zips do `release.yml`.
#
# Uma tag de versão — a mesma do `release.yml` — anexa os zips do core ao rascunho da release.
# Os instaladores continuam saindo só do `release.yml`.

name: libretro

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
      - "[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
  pull_request:
    paths:
      - "frontends/libretro/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/libretro.yml"

permissions:
  contents: read

jobs:
  core:
    name: core-${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: linux-x86_64
            sistema: ubuntu-22.04
            biblioteca: target/release/libzeebx_libretro.so
            pacote: zeebx_libretro.so
          - nome: windows-x86_64
            sistema: windows-latest
            biblioteca: target/release/zeebx_libretro.dll
            pacote: zeebx_libretro.dll
          - nome: macos-arm64
            sistema: macos-latest
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
          - nome: macos-x86_64
            sistema: macos-15-intel
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-${{ matrix.nome }}

      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 libclang-dev

      - name: Dependências do macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      - name: Compila o core
        run: cargo build --release --locked -p zeebx-libretro

      - name: A biblioteca carrega e a ABI responde
        run: python3 ferramentas/verifica_core.py "${{ matrix.biblioteca }}"

      - name: O core não depende de biblioteca de host (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd "${{ matrix.biblioteca }}"
          if ldd "${{ matrix.biblioteca }}" | grep -qiE 'libX11|wayland|EGL|libGL|asound|libudev|gtk'; then
            echo "o core puxou biblioteca de interface: vídeo, áudio e entrada são do frontend"
            exit 1
          fi
          echo "só libc, libm, libstdc++ e libgcc"

      - name: Monta o pacote do core
        shell: bash
        run: |
          mkdir -p pacote
          cp "${{ matrix.biblioteca }}" "pacote/${{ matrix.pacote }}"
          cp frontends/libretro/zeebx_libretro.info pacote/
          grep -q '^display_name = "Zeebx"' pacote/zeebx_libretro.info

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_${{ matrix.nome }}
          path: pacote/
          if-no-files-found: error

  release:
    needs: core
    # Sai com o que deu certo: um alvo que falhou não segura os outros.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: nucleos
          pattern: zeebx_libretro_*

      - name: Zip por alvo
        run: |
          mkdir -p dist
          shopt -s nullglob
          for d in nucleos/zeebx_libretro_*; do
            nome=$(basename "$d")
            (cd "$d" && zip -9 "../../dist/${nome}.zip" *)
          done
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: true
          # O `release.yml` já gera as notas; aqui só entram os zips do core.
          generate_release_notes: false
          files: dist/*
          fail_on_unmatched_files: true
