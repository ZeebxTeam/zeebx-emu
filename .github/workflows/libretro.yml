# Compila o core Libretro e confere que ele é carregável e completo.
#
# O core é um pacote separado (`frontends/libretro`) e o build dele **não** usa biblioteca de
# interface: sem ALSA, sem udev, sem Wayland ou X11. As provas, em ordem de força:
#
# 1. a biblioteca **carrega** de verdade (`ctypes` = `dlopen`/`LoadLibrary`, como o frontend faz) —
#    isso apanha dependência que faltou no link, que uma lista de símbolos não apanha;
# 2. os 25 símbolos `retro_*` respondem, `retro_api_version` devolve 1 e `retro_get_system_info`
#    preenche a struct com `Zeebx`, `mod|zip`, `need_fullpath` e `block_extract`;
# 3. no Linux, `ldd` mostra que não há `libX11`, Wayland, EGL, ALSA, udev nem GTK pendurados.
#
# Cada alvo roda no seu próprio runner: AArch64 Linux e Windows em runner ARM64 nativo, porque
# cross-build de `unicorn` (QEMU em C) e `dynarmic` (C++20 com CMake) exigiria toolchain e sysroot
# que ninguém quer manter só para empacotar. O Switch é a exceção: o `.a` sai da imagem
# `devkitpro/devkita64`, pelo `frontends/switch/compilar.sh`.

name: libretro

# **Só à mão, pela aba Actions.** Nenhum push ou merge dispara isto: quem gasta runner sozinho é
# o `release.yml`, na tag. Rode daqui quando quiser conferir o core antes de marcar uma versão.
on:
  workflow_dispatch:

# Uma execução nova espera a anterior do mesmo ref terminar, em vez de derrubá-la no meio.
concurrency:
  group: libretro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: core-${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        # Disparo à mão é sempre a matriz inteira: quem pede o run quer a resposta dos seis alvos.
        alvo:
          - linux-x86_64
          - linux-aarch64
          - windows-x86_64
          - windows-aarch64
          - macos-x86_64
          - macos-arm64
        include:
          - alvo: linux-x86_64
            nome: linux-x86_64
            sistema: ubuntu-24.04
            biblioteca: target/release/libzeebx_libretro.so
            pacote: zeebx_libretro.so
          - alvo: linux-aarch64
            nome: linux-aarch64
            sistema: ubuntu-24.04-arm
            biblioteca: target/release/libzeebx_libretro.so
            pacote: zeebx_libretro.so
          - alvo: windows-x86_64
            nome: windows-x86_64
            sistema: windows-latest
            biblioteca: target/release/zeebx_libretro.dll
            pacote: zeebx_libretro.dll
          - alvo: windows-aarch64
            nome: windows-aarch64
            sistema: windows-11-arm
            # Windows ARM64 **não** tem o `unicorn` (falta montador MASM para ARM64 e o QEMU do Windows
            # monta um `.asm` com o `ml` do MSVC, que só existe para x86 e x64). O alvo compila assim
            # mesmo: o `unicorn-engine` sai do grafo por dependência condicional de alvo e o motor usa o
            # `dynarmic`, que recompila os blocos A32. Ver `src/cpu/mod.rs`, `BackendPadrao`.
            biblioteca: target/release/zeebx_libretro.dll
            pacote: zeebx_libretro.dll
          - alvo: macos-x86_64
            nome: macos-x86_64
            sistema: macos-15-intel
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
          - alvo: macos-arm64
            nome: macos-arm64
            sistema: macos-latest
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-${{ matrix.nome }}

      # As duas dependências nativas: o `unicorn-engine` compila o QEMU em C e usa o `bindgen`
      # (que carrega o `libclang`), e o `dynarmic` compila C++20 com CMake e Ninja. Depender do que
      # a imagem do runner já traz funciona até o dia em que não traz.
      - name: Dependências do build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libclang-dev libglib2.0-dev

      - name: Dependências do build (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      # Sem debuginfo a árvore do `dynarmic` sai de mais de 5 GiB para algumas centenas de MB.
      - name: Compila o core
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          # A35 é o denominador comum seguro entre RK3326 e H700/A53. AArch64 continua usando
          # NEON/AdvSIMD, mas o artefato não ganha instrução exclusiva do Cortex-A53.
          RUSTFLAGS: ${{ matrix.alvo == 'linux-aarch64' && '-C target-cpu=cortex-a35' || '' }}
        run: cargo build --release --locked -p zeebx-libretro

      # A prova principal: abrir a biblioteca como o frontend abre e chamar a ABI.
      - name: A biblioteca carrega e a ABI responde
        run: python3 ferramentas/verifica_core.py "${{ matrix.biblioteca }}"

      - name: O core não depende de biblioteca de host (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd "${{ matrix.biblioteca }}"
          if ldd "${{ matrix.biblioteca }}" | grep -qiE 'libX11|wayland|EGL|libGL|asound|libudev|gtk'; then
            echo "o core puxou biblioteca de interface: vídeo, áudio e entrada são do frontend"
            exit 1
          fi
          echo "só libc, libm, libstdc++ e libgcc"

      # R36S/R35S/RGB20S (ArkOS, AeolusUX, dArkOS e dArkOSen) e RG40XX-H (muOS Pixie ou
      # posterior) carregam o mesmo core Linux AArch64. Não basta o nome do job: confira o ELF
      # que será copiado para o cartão e rejeite um artefato x86 ou uma biblioteca com RPATH da
      # máquina de build. A checagem de dependências acima continua proibindo bibliotecas desktop.
      - name: O artefato handheld é AArch64 portátil
        if: matrix.alvo == 'linux-aarch64'
        shell: bash
        run: |
          file "${{ matrix.biblioteca }}" | grep -Eiq 'ARM aarch64|aarch64'
          readelf -h "${{ matrix.biblioteca }}" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          if readelf -d "${{ matrix.biblioteca }}" | grep -Eiq 'RPATH|RUNPATH'; then
            echo "o core não pode carregar caminho da máquina de build"
            exit 1
          fi
          echo "ELF Linux AArch64 sem caminho absoluto de build"

      - name: Monta o pacote do core
        shell: bash
        run: |
          mkdir -p pacote
          cp "${{ matrix.biblioteca }}" "pacote/${{ matrix.pacote }}"
          cp frontends/libretro/zeebx_libretro.info pacote/
          grep -q '^database = "Mobile - Zeebo"' pacote/zeebx_libretro.info
          ls -la pacote/

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_${{ matrix.nome }}
          path: pacote/

  # Biblioteca estática para o ROMBundler / RetroArch web ligar como SIDE_MODULE. A std é
  # recompilada com panic=abort (precisa de rust-src): o módulo principal não exporta unwind.
  wasm:
    name: core-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
          components: rust-src

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.8"

      - name: Compila o side module
        run: ./ferramentas/compilar_wasm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_emscripten
          path: target/wasm/

  # Biblioteca estática para o ROMBundler ligar no Horizon. O devkitA64 não está no runner:
  # o job inteiro roda na imagem oficial, e o `compilar.sh --local` aplica o cfg, o patch do
  # JIT e o empacotamento do dynarmic no `.a`.
  switch:
    name: core-switch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Tag datada, não `latest`: a imagem nova entra quando alguém muda esta linha.
      image: devkitpro/devkita64:20260219
    steps:
      - name: Git e CMake
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake curl git ninja-build pkg-config python3

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-switch

      - name: Compila o staticlib
        run: ./frontends/switch/compilar.sh --local

      - name: O arquivo é AArch64
        run: |
          tmp=$(mktemp -d)
          ( cd "$tmp" && ar x "$GITHUB_WORKSPACE/frontends/switch/saida/libzeebx_libretro.a" )
          ruim=$(aarch64-none-elf-objdump -f "$tmp"/*.o | grep 'file format' | grep -v elf64-littleaarch64 || true)
          if [ -n "$ruim" ]; then
            echo "o .a misturou objeto que não é AArch64"
            echo "$ruim"
            exit 1
          fi
          echo "libzeebx_libretro.a é ELF AArch64"

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_switch
          path: frontends/switch/saida/libzeebx_libretro.a
