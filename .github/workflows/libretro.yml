# Builds the Libretro core and checks that it is loadable and complete.
#
# The core is a separate package (`frontends/libretro`) and its build does **not** use an
# interface library: no ALSA, no udev, no Wayland or X11. The proofs, in order of strength:
#
# 1. the library really **loads** (`ctypes` = `dlopen`/`LoadLibrary`, as the frontend does) —
#    that catches a dependency missing at link time, which a symbol list doesn't catch;
# 2. the 25 `retro_*` symbols respond, `retro_api_version` returns 1 and `retro_get_system_info`
#    fills the struct with `Zeebx`, `mod|zip`, `need_fullpath` and `block_extract`;
# 3. on Linux, `ldd` shows there is no `libX11`, Wayland, EGL, ALSA, udev or GTK hanging on.
#
# Each target runs on its own runner: AArch64 Linux and Windows on a native ARM64 runner, because
# cross-building `unicorn` (QEMU in C) and `dynarmic` (C++20 with CMake) would require a toolchain
# and sysroot nobody wants to maintain just to package. Two exceptions come from an image, through
# the frontend script: the Switch, from `devkitpro/devkita64`; the Vita, from `vitasdk/vitasdk`.

name: libretro

# **Only by hand, from the Actions tab.** No push or merge triggers this: what spends runners on
# its own is `release.yml`, on the tag. Run it from here when you want to check the core before
# tagging a version.
on:
  workflow_dispatch:

# A new run waits for the previous one on the same ref to finish, instead of killing it halfway.
concurrency:
  group: libretro-${{ github.ref }}
  cancel-in-progress: false

jobs:
  core:
    name: core-${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    strategy:
      fail-fast: false
      matrix:
        # A manual trigger is always the whole matrix: whoever requests the run wants the answer
        # for the six targets.
        alvo:
          - linux-x86_64
          - linux-aarch64
          - windows-x86_64
          - windows-aarch64
          - macos-x86_64
          - macos-arm64
        include:
          - alvo: linux-x86_64
            nome: linux-x86_64
            sistema: ubuntu-24.04
            biblioteca: target/release/libzeebx_libretro.so
            pacote: zeebx_libretro.so
          - alvo: linux-aarch64
            nome: linux-aarch64
            sistema: ubuntu-24.04-arm
            biblioteca: target/release/libzeebx_libretro.so
            pacote: zeebx_libretro.so
          - alvo: windows-x86_64
            nome: windows-x86_64
            sistema: windows-latest
            biblioteca: target/release/zeebx_libretro.dll
            pacote: zeebx_libretro.dll
          - alvo: windows-aarch64
            nome: windows-aarch64
            sistema: windows-11-arm
            # Windows ARM64 does **not** have `unicorn` (there is no MASM assembler for ARM64, and
            # QEMU on Windows assembles a `.asm` with MSVC's `ml`, which only exists for x86 and
            # x64). The target builds anyway: `unicorn-engine` leaves the graph through a
            # target-conditional dependency and the engine uses `dynarmic`, which recompiles the A32
            # blocks. See `src/cpu/mod.rs`, `DefaultBackend`.
            biblioteca: target/release/zeebx_libretro.dll
            pacote: zeebx_libretro.dll
          - alvo: macos-x86_64
            nome: macos-x86_64
            sistema: macos-15-intel
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
          - alvo: macos-arm64
            nome: macos-arm64
            sistema: macos-latest
            biblioteca: target/release/libzeebx_libretro.dylib
            pacote: zeebx_libretro.dylib
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-${{ matrix.nome }}

      # The two native dependencies: `unicorn-engine` compiles QEMU in C and uses `bindgen`
      # (which loads `libclang`), and `dynarmic` compiles C++20 with CMake and Ninja. Depending on
      # what the runner image already ships works until the day it doesn't.
      - name: Build dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config python3 \
            libclang-dev libglib2.0-dev

      - name: Build dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      # Without debuginfo the `dynarmic` tree goes from more than 5 GiB to a few hundred MB.
      - name: Build the core
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          # A35 is the safe common denominator between RK3326 and H700/A53. AArch64 still uses
          # NEON/AdvSIMD, but the artifact gains no Cortex-A53-only instruction.
          RUSTFLAGS: ${{ matrix.alvo == 'linux-aarch64' && '-C target-cpu=cortex-a35' || '' }}
        run: cargo build --release --locked -p zeebx-libretro

      # The main proof: open the library the way the frontend opens it and call the ABI.
      - name: The library loads and the ABI responds
        run: python3 tools/verify_core.py "${{ matrix.biblioteca }}"

      - name: The core doesn't depend on a host library (Linux)
        if: runner.os == 'Linux'
        run: |
          ldd "${{ matrix.biblioteca }}"
          if ldd "${{ matrix.biblioteca }}" | grep -qiE 'libX11|wayland|EGL|libGL|asound|libudev|gtk'; then
            echo "the core pulled in an interface library: video, audio and input belong to the frontend"
            exit 1
          fi
          echo "only libc, libm, libstdc++ and libgcc"

      # R36S/R35S/RGB20S (ArkOS, AeolusUX, dArkOS and dArkOSen) and RG40XX-H (muOS Pixie or
      # later) load the same Linux AArch64 core. The job name isn't enough: check the ELF that
      # will be copied to the card and reject an x86 artifact or a library with an RPATH from the
      # build machine. The dependency check above still forbids desktop libraries.
      - name: The handheld artifact is portable AArch64
        if: matrix.alvo == 'linux-aarch64'
        shell: bash
        run: |
          file "${{ matrix.biblioteca }}" | grep -Eiq 'ARM aarch64|aarch64'
          readelf -h "${{ matrix.biblioteca }}" | grep -E 'Class:.*ELF64|Machine:.*AArch64'
          if readelf -d "${{ matrix.biblioteca }}" | grep -Eiq 'RPATH|RUNPATH'; then
            echo "the core must not carry a path from the build machine"
            exit 1
          fi
          echo "Linux AArch64 ELF with no absolute build path"

      - name: Assemble the core package
        shell: bash
        run: |
          mkdir -p pacote
          cp "${{ matrix.biblioteca }}" "pacote/${{ matrix.pacote }}"
          cp frontends/libretro/zeebx_libretro.info pacote/
          grep -q '^database = "Mobile - Zeebo"' pacote/zeebx_libretro.info
          ls -la pacote/

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_${{ matrix.nome }}
          path: pacote/

  # Static library for ROMBundler / RetroArch web to link as a SIDE_MODULE. std is
  # rebuilt with panic=abort (needs rust-src): the main module doesn't export unwind.
  wasm:
    name: core-wasm
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-emscripten
          components: rust-src

      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: "6.0.8"

      - name: Build the side module
        run: ./tools/build_wasm.sh

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_emscripten
          path: target/wasm/

  # Static library for ROMBundler to link on Horizon. devkitA64 isn't on the runner:
  # the whole job runs in the official image, and `build.sh --local` applies the cfg, the JIT
  # patch and the packing of dynarmic into the `.a`.
  switch:
    name: core-switch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container:
      # Dated tag, not `latest`: the new image goes in when someone changes this line.
      image: devkitpro/devkita64:20260219
    steps:
      - name: Git and CMake
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates cmake curl git ninja-build pkg-config python3

      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-switch

      - name: Build the staticlib
        run: ./frontends/switch/build.sh --local

      - name: The archive is AArch64
        run: |
          tmp=$(mktemp -d)
          ( cd "$tmp" && ar x "$GITHUB_WORKSPACE/frontends/switch/out/libzeebx_libretro.a" )
          ruim=$(aarch64-none-elf-objdump -f "$tmp"/*.o | grep 'file format' | grep -v elf64-littleaarch64 || true)
          if [ -n "$ruim" ]; then
            echo "the .a mixed in an object that is not AArch64"
            echo "$ruim"
            exit 1
          fi
          echo "libzeebx_libretro.a is AArch64 ELF"

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_switch
          path: frontends/switch/out/libzeebx_libretro.a

  # Static library for the Vita's RetroArch to link. vitasdk isn't on the runner: the whole
  # job runs in the official image, and `build.sh --local` rebuilds std (the target is tier 3)
  # and checks that the `.a` is 32-bit ARM and exports the ABI. The archive doesn't open on its
  # own: RetroArch consumes it as `libretro_vita.a`.
  vita:
    name: core-vita
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      # Dated tag, not `latest`: the new image goes in when someone changes this line.
      image: vitasdk/vitasdk:2026.08
    steps:
      - name: Git, curl and the host compiler
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config

      - uses: actions/checkout@v5

      # 1.99.1 on purpose. The core rebuilds std with `RUSTC_BOOTSTRAP=1`.
      # A new stable may reject that; the version goes up when someone changes this line.
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.1
          components: rust-src

      - uses: Swatinem/rust-cache@v2
        with:
          key: libretro-vita

      - name: Build the staticlib
        run: ./frontends/vita/build.sh --local

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx_libretro_vita
          path: frontends/vita/out/libzeebx_libretro.a
