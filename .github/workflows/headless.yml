# Compila, testa e abre o frontend sem interface nas seis plataformas.
#
# O `release.yml` empacota o headless em quatro alvos, e só na tag. Aqui a pergunta é outra e vem
# antes: "ele compila, os testes passam e o binário responde?" — nos seis alvos, inclusive os dois
# ARM64 que a release não empacota.
#
#   linux-x86_64 / linux-aarch64      ubuntu-24.04 / ubuntu-24.04-arm
#   windows-x86_64 / windows-aarch64  windows-latest / windows-11-arm
#   macos-x86_64 / macos-arm64        macos-15-intel / macos-latest
#
# **Nenhum push ou merge dispara isto.** O único gatilho automático do repositório é a tag, no
# `release.yml`; aqui é você quem pede o run pela aba Actions.
#
# Runners nativos, não cross-compilação: o `unicorn` compila o QEMU em C e o `dynarmic` compila
# C++20 — a combinação que faz cross-build sofrer. No `windows-aarch64` o `unicorn` sai do grafo
# por dependência condicional de alvo e o motor usa o `dynarmic`; ver `src/cpu/mod.rs`.

name: headless

on:
  workflow_dispatch:

# Um run não cancela o outro: uma matriz de seis runners que morre no meio não responde nada.
concurrency:
  group: headless-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compila:
    name: ${{ matrix.nome }}
    runs-on: ${{ matrix.sistema }}
    # Um alvo pendurado não pode queimar a cota da conta.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: linux-x86_64
            sistema: ubuntu-24.04
            binario: target/release/zeebx-headless
          - nome: linux-aarch64
            sistema: ubuntu-24.04-arm
            binario: target/release/zeebx-headless
          - nome: windows-x86_64
            sistema: windows-latest
            binario: target/release/zeebx-headless.exe
          - nome: windows-aarch64
            sistema: windows-11-arm
            binario: target/release/zeebx-headless.exe
          - nome: macos-x86_64
            sistema: macos-15-intel
            binario: target/release/zeebx-headless
          - nome: macos-arm64
            sistema: macos-latest
            binario: target/release/zeebx-headless
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # Cache separado do `ci`: lá o perfil compila a biblioteca inteira com o eframe do desktop,
      # aqui o alvo é outro binário. Misturar as chaves é invalidar as duas o tempo todo.
      - uses: Swatinem/rust-cache@v2
        with:
          key: headless-${{ matrix.nome }}

      # A lista do `release.yml`, mais `ninja` e `libclang`: o `dynarmic` pede gerador Ninja e o
      # `bindgen` do unicorn carrega a biblioteca do clang. O `winit` e o `glutin` continuam
      # pedindo X11, Wayland e GL no link, mesmo sem interface — é a janela, não a interface.
      - name: Dependências do Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config python3 libclang-dev \
            libglib2.0-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev

      - name: Dependências do macOS
        if: runner.os == 'macOS'
        run: brew install cmake ninja pkg-config || true

      # Sem debuginfo a árvore do `dynarmic` sai de mais de 5 GiB para algumas centenas de MB.
      - name: Compila
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: cargo build --release --locked -p zeebx-headless

      - name: Testes
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: cargo test --release --locked -p zeebx-headless

      - name: O binário existe
        shell: bash
        run: ls -la ${{ matrix.binario }}

      # As três saídas que não precisam de jogo nem de tela, e que provam coisas diferentes:
      # `--version` é o binário subindo, `--example` é o `config.ini` modelo saindo inteiro (o que
      # a primeira execução escreve ao lado do executável) e `--controllers` exercita a
      # inicialização de verdade — udev e gilrs — antes de sair.
      - name: O binário responde (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          ${{ matrix.binario }} --version
          ${{ matrix.binario }} --example | grep -q '^\[' || {
            echo "o config.ini modelo saiu sem seção nenhuma"
            exit 1
          }
          # O macOS não traz o `timeout` do GNU; o `perl` traz o alarme, e existe em toda imagem.
          if [ "$RUNNER_OS" = "macOS" ]; then
            perl -e 'alarm 60; exec @ARGV' ${{ matrix.binario }} --controllers
          else
            timeout 60 ${{ matrix.binario }} --controllers
          fi

      - name: O binário responde (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${{ matrix.binario }}" --version
          $modelo = & "${{ matrix.binario }}" --example
          if (-not ($modelo -match '^\[')) { throw "o config.ini modelo saiu sem secao nenhuma" }
          $prova = Start-Process -FilePath "${{ matrix.binario }}" -ArgumentList "--controllers" -PassThru -NoNewWindow
          if (-not $prova.WaitForExit(60000)) { $prova.Kill(); throw "o binario pendurou" }
          if ($prova.ExitCode -ne 0) { throw "o binario saiu com $($prova.ExitCode)" }

      # Bancada de teste para quem não quer compilar: o binário, o `config.ini` comentado e o
      # leia-me, do mesmo jeito que a release entrega.
      - name: Junta a entrega
        shell: bash
        run: |
          mkdir -p entrega
          cp frontends/headless/config.ini frontends/headless/LEIAME.md entrega/
          cp ${{ matrix.binario }} entrega/
          ls -l entrega

      - uses: actions/upload-artifact@v4
        with:
          name: zeebx-headless-${{ matrix.nome }}
          path: entrega/
          if-no-files-found: error
          retention-days: 14
